<script>
'use strict';
const D=JSON.parse(document.getElementById('public-data').textContent), main=document.getElementById('main');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=u=>{try{const x=new URL(u);return ['http:','https:'].includes(x.protocol)&&!x.username&&!x.password?u:null}catch{return null}};
const ext=(u,label)=>safeUrl(u)?`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(label)}</a>`:'<span class="muted">No public source link recorded</span>';
const tag=(t,cls='')=>`<span class="tag ${cls}">${esc(t)}</span>`;

const roleStatus=p=>({advertised_local_clergy:'Listed by church or official directory',history_page_current_claim:'Undated history claim; current appointment unconfirmed',local_clergy_listing_office_unspecified:'Clergy named; precise office not stated',dated_interim_role_announcement:'Dated interim-role listing',former_local_clergy:'Former or retired clergy'})[p.relationship_status]||'Source-stated role';

function sources(urls){return '<ul class="source-list">'+[...new Set(urls.filter(Boolean))].map((u,i)=>`<li>${ext(u,(urls.length>1?'Source '+(i+1)+': ':'')+new URL(u).hostname.replace(/^www\./,''))}<br><span class="link-label">${esc(u)}</span></li>`).join('')+'</ul>'}
function crumb(view,name){document.getElementById('crumb').innerHTML=`<a href="#view=overview">Overview</a>${view==='overview'?'':`<span>/</span><a href="${path(view)}">${esc(label[view])}</a>`}${name?`<span>/</span>${esc(name)}`:''}`}
function nav(view){document.querySelectorAll('[data-nav]').forEach(a=>{if(a.dataset.nav===(view==='about'?'sources':view))a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')})}
function detailLink(view,r){return path(view,{id:r.id,back:location.hash.slice(1)})}
function backLink(view){const b=new URLSearchParams(state.back||'');const v=b.get('view');return v===view?'#'+b.toString():path(view)}
function overview(){main.innerHTML=`<h1>Find churches and collection routes</h1><p class="lead">Compare archive access, inspect dated item records, and follow the evidence for churches and named speakers.</p><div class="actions"><a class="action primary" href="#view=feasibility">Compare collection routes</a><a class="action" href="#view=churches">Find a church or pastor</a><a class="action" href="#view=churches&map=open">Open the map</a></div><div class="metric-grid"><a href="#view=feasibility"><strong>12</strong><span>Sources selected for close review</span></a><a href="#view=feasibility&category=priority_text"><strong>2</strong><span>Priority text candidates</span></a><a href="#view=churches"><strong>86</strong><span>Supported church identities</span></a></div><h2>What can be collected?</h2><p>The strongest text candidates are Fourth Presbyterian in Chicago and Adam Thomas’s archive associated with St Mark’s in Mystic. Their detail pages separate annual indexes from inspected targets, name speakers where supported, and show date conflicts and reuse limits.</p><p>Three SermonAudio routes still need export checks. Holy Trinity in San Francisco offers a recording route; usable transcripts and permission for transcription remain unconfirmed. <a href="#view=feasibility">Compare all 12 sources</a> or inspect <a href="#view=feasibility&group=supplemental">three separate supplemental leads</a>.</p><div class="note"><strong>This website contains metadata and source links.</strong><br>No full transcripts, manuscript bodies, captions or recordings are hosted. Original links show what each publisher makes available.</div><div class="table-wrap method-table"><table><caption>Separate collections in this catalogue</caption><thead><tr><th>Collection</th><th>What you can inspect</th><th>Counting unit</th></tr></thead><tbody><tr><td><a href="#view=feasibility">12 source screens</a></td><td>Collection route, named-speaker evidence, observed dates, access and reuse limits, next action.</td><td>Purposefully selected church/source screens. The three supplemental leads are separate.</td></tr><tr><td><a href="#view=churches">86 church identities</a></td><td>City/state, affiliation evidence, clergy role and original sources. ${D.counts.churches_with_named_clergy} churches have ${D.counts.named_clergy_records} named-role records.</td><td>48 identities from the original sample and 38 from the additional sample.</td></tr><tr><td><a href="#view=items">47 text-item records</a></td><td>Title, author or speaker, date meaning, format, publisher link and quality limits.</td><td>36 earlier archive items plus 11 separate manuscripts and timed transcripts; some have other or mixed genres.</td></tr><tr><td><a href="#view=sources">83 source records</a></td><td>Archives, church sites, datasets, preparation resources and AI-use evidence.</td><td>70 originals inspected, 11 inspection blocks and two discovery leads.</td></tr></tbody></table></div><h2>What these records establish</h2><p>They identify practical routes and document what was observed. They do not form a representative national sermon corpus or identify AI use from text. No item linked to the frozen church samples yet meets every study requirement; that does not mean there are no feasible collection routes.</p><p><a href="#view=about">Study scope, missing evidence and attribution</a></p>`}
function filterControls(view){const options=(vals,selected)=>'<option value="">All</option>'+vals.map(v=>`<option value="${esc(v)}" ${v===selected?'selected':''}>${esc(v)}</option>`).join('');return `<form class="filters" id="filters"><label class="search">${view==='churches'?'Church, clergy name or city':view==='items'?'Title, author or speaker':'Source name or topic'}<input type="search" name="q" value="${esc(state.q||'')}" autocomplete="off"></label>${view==='churches'?`<label>State / DC<select name="region">${options([...new Set(D.churches.map(r=>r.state_name))].sort(),state.region)}</select></label><label>Affiliation evidence<select name="body">${options([...new Set(D.churches.map(r=>r.affiliation))].sort(),state.body)}</select></label><label>Clergy information<select name="clergy">${options(['Name in reviewed source','Name not established'],state.clergy)}</select></label>`:view==='items'?`<label>Collection<select name="collection">${options(['Earlier archive collection','Separate 11-item collection'],state.collection)}</select></label><label>Text format<select name="format">${options([...new Set(D.items.map(r=>r.format))].sort(),state.format)}</select></label>`:`<label>Source inspection<select name="status">${options([...new Set(D.sources.map(r=>r.status))].sort(),state.status)}</select></label>`}<button type="button" id="reset">Clear filters</button></form>`}
function setFilters(){const f=document.getElementById('filters');f.addEventListener('submit',e=>{e.preventDefault();updateFilters()});f.addEventListener('change',updateFilters);f.elements.namedItem('q').addEventListener('input',()=>{clearTimeout(filterTimer);filterTimer=setTimeout(updateFilters,250)});document.getElementById('reset').onclick=()=>{location.hash=path(currentView)}}
function updateFilters(){clearTimeout(filterTimer);const form=document.getElementById('filters');if(!form)return;const active=document.activeElement;const focused=active?.name;const cursor=active?.selectionStart;const next={view:currentView};for(const [k,v]of new FormData(form))if(v)next[k]=v;if(state.sort)next.sort=state.sort;history.replaceState(null,'',path(currentView,next));render(false);if(focused){const e=document.querySelector(`[name="${focused}"]`);e?.focus();if(cursor!==null&&e?.type==='search')e.setSelectionRange(cursor,cursor)}}
function filtered(view){const list=view==='churches'?D.churches:view==='items'?D.items:D.sources;const q=(state.q||'').toLowerCase();return list.filter(r=>{const text=view==='churches'?[r.name,r.city,r.state_name,r.affiliation,...r.people.flatMap(p=>[p.name,p.role_verbatim])]:view==='items'?[r.title,r.person,r.kind,r.church]:[r.name,r.type,r.unit,r.languages,r.regions];return (!q||text.join(' ').toLowerCase().includes(q))&&(!state.region||r.state_name===state.region)&&(!state.body||r.affiliation===state.body)&&(!state.clergy||(state.clergy==='Name in reviewed source')===!!r.people?.length)&&(!state.collection||r.collection===state.collection)&&(!state.format||r.format===state.format)&&(!state.status||r.status===state.status)})}
function mapMarkup(rows){const counts={};rows.forEach(r=>counts[r.state]=(counts[r.state]||0)+1);const colors=n=>n===0?'#e9edf1':n<3?'#cbded7':n<5?'#83b4a4':'#246857';return `<details id="map-section"><summary>Map and state counts</summary><p class="small">${rows.length} source-supported identities under the current filters. Shading counts these records; it is not church-population coverage. Alaska and Hawaii are repositioned.</p><div class="map"><svg viewBox="${D.map.viewBox}" role="group" aria-label="Accepted church identities by state">${D.map.paths.map(p=>`<path d="${p.d}" fill="${colors(counts[p.code]||0)}" role="button" tabindex="0" aria-label="${p.name}: ${counts[p.code]||0} listed identities. Filter this state." data-state="${p.name}" aria-pressed="${state.region===p.name}"><title>${p.name}: ${counts[p.code]||0}</title></path>`).join('')}</svg><div class="legend">${[[0,'0'],[1,'1–2'],[3,'3–4'],[5,'5 or more']].map(([n,t])=>`<span><i style="background:${colors(n)}"></i>${t}</span>`).join('')}</div></div><p class="small">State filter above provides the same selection without using the map. <a href="#view=about">Map and location attribution</a>.</p></details>`}
function affiliationCounts(rows){const counts={};rows.forEach(r=>counts[r.affiliation]=(counts[r.affiliation]||0)+1);return `<details><summary>Affiliation counts</summary><p class="small">${rows.length} accepted identities under the current filters. Labels have different evidence scopes: local church statements and denominational-directory corroboration are identified in each record. They are not equally precise, independently verified jurisdictions. Unknown affiliation is kept separate.</p><div class="table-wrap method-table"><table><caption>Affiliation within the displayed church records</caption><thead><tr><th>Affiliation</th><th>Church identities</th></tr></thead><tbody>${Object.entries(counts).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).map(([body,n])=>`<tr><td><a href="${path('churches',{...state,body,page:1})}">${esc(body)}</a></td><td>${n}</td></tr>`).join('')}</tbody></table></div></details>`}
function listing(view){const headings={churches:['Churches & pastors','86 identities supported by church pages or official directories. A clergy name is shown only when reviewed evidence states the person’s role.'],items:['Sermon & text records','47 records with links to their original publishers. These include manuscripts, transcripts, devotional pieces and excerpts. No full texts are hosted here.'],sources:['Sources & methods','83 sources considered for sermon research. Inspection, usable text and permission are separate questions.']};let rows=filtered(view);const key=state.sort||((view==='items')?'title':'name');rows.sort((a,b)=>String(a[key]||'').localeCompare(String(b[key]||'')));shown=rows;const page=Math.max(1,Math.min(Number(state.page)||1,Math.ceil(rows.length/20)||1));const pageRows=rows.slice((page-1)*20,page*20);const columns=view==='churches'?['Church','City / state','Affiliation','Clergy in reviewed sources','Details']:view==='items'?['Title','Author / speaker','Date evidence','Format','Details']:['Source','Inspection','Material','Collection / permission','Details'];main.innerHTML=`<div class="section-head"><h1>${headings[view][0]}</h1>${view==='sources'?'<a href="#view=about">How to read the evidence</a>':''}</div><p>${headings[view][1]}</p>${filterControls(view)}${view==='churches'?mapMarkup(rows)+affiliationCounts(rows):''}<div class="toolbar"><div class="status" role="status">${rows.length} of ${view==='churches'?86:view==='items'?47:83} records match. ${rows.length?`Showing ${(page-1)*20+1}–${Math.min(page*20,rows.length)}.`:''}</div><div><label class="small">Sort <select id="sort"><option value="${view==='items'?'title':'name'}">Name / title</option>${view==='churches'?'<option value="state_name">State</option>':view==='items'?'<option value="person">Author / speaker</option>':'<option value="status">Inspection status</option>'}</select></label> <button id="export">Export this list</button></div></div>${rows.length?`<div class="table-wrap" role=" er filters or a broader search term.</p><a href="'+path(view)+'">Show all records in this section</a></div>'}<p class="result-note">${view==='churches'?'Affiliation comes from the stated church or directory evidence. It is not inferred from a provider category. Sources were checked on the dates shown in each record.':view==='items'?'A manuscript date, publication date and recording date can differ. Neither a title nor a date proves that a sermon was delivered as written.':'An inspected source can still require permission or have no usable sermon text. Availability may have changed since the recorded check.'}</p>`;setFilters();document.getElementById('sort').value=key;document.getElementById('sort').onchange=e=>{location.hash=path(view,{...state,sort:e.target.value,page:1})};for(const [id,step]of [['prev',-1],['next',1]]){const e=document.getElementById(id);if(e)e.onclick=()=>location.hash=path(view,{...state,page:page+step})}document.getElementById('export').onclick=()=>exportCsv(view);document.querySelectorAll('[data-state]').forEach(el=>{const go=()=>{location.hash=path(view,{...state,region:el.dataset.state,page:1})};el.onclick=go;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}}})}
function church(r){main.innerHTML=`<a class="back" href="${backLink('churches')}">Back to church results</a><h1>${esc(r.name)}</h1><p class="lead">${esc(r.city||'City not established')}, ${esc(r.state_name)}</p>${tag(r.identity_status,'known')}${facts([['Affiliation',esc(r.affiliation)],['Source wording',esc(r.affiliation_as_stated)],['Affiliation evidence',esc(r.affiliation_scope||'Exact body not established')],['Affiliation organization',esc(r.affiliation_organization||'Not separately established')],['Affiliation checked',esc(r.affiliation_checked_on||r.checked_on)],['Church source checked',esc(r.checked_on)],['Sample',esc(r.sample)],['Study-eligible sermon text','None linked to this sampled church']])}${r.affiliation_note?`<p class="notice">${esc(r.affiliation_note)}</p>`:''}<h2>Pastor / clergy identity</h2>${r.people.length?r.people.map(p=>`<article class="people"><h3>${esc(p.name)}</h3><p>${esc(roleLabel(p))}</p><p class="small">${tag(roleStatus(p),p.relationship_status==='former_local_clergy'||p.relationship_status==='history_page_current_claim'?'caution':'known')}</p><p>${esc(p.evidence_paraphrase)}</p><p class="small muted">${esc(p.temporal_limit)} Page captured ${esc(p.source_captured_at.slice(0,10))}; role reviewed ${esc(p.checked_on)}.</p>${ext(p.source_url,'Open the source for this person and role')}</article>`).join(''):`<p class="notice">${esc(r.pastor_status||'No clergy name was established in the reviewed sources.')} This does not mean the church has no clergy.</p>`}<h2>Original church evidence</h2>${sources(r.source_urls)}<h2>Sermon evidence</h2><p>No sermon text from this sampled church currently meets every study requirement. Church identity does not establish a preacher-to-sermon link, delivery date, spoken wording or reuse rights.</p><p><a href="#view=feasibility">Compare the separate collection-route screens</a> · <a href="#view=items">Browse the separate text-item collections</a></p>`}
function item(r){main.innerHTML=`<a class="back" href="${backLink('items')}">Back to item results</a><h1>${esc(r.title)}</h1><p class="lead">${esc(r.person)}</p><p>${esc(r.person_role)}</p><div class="actions">${r.source_url?`<a class="action primary" href="${esc(r.source_url)}" target="_blank" rel="noopener noreferrer">Open original publisher page</a>`:''}</div><p class="notice">${esc(r.text_available.replace(/\.$/,''))}. There is no full-text download on this public site.</p>${facts([['Collection',esc(r.collection)],['Material',esc(r.kind)+' · '+esc(r.format)],['Date evidence',r.dates.length?r.dates.map(d=>`${esc(d.value)} (${esc(d.type)})`).join('<br>'):'Date not established'],['Publication date',esc(r.publication||'Not recorded')],['Modification date',esc(r.modification||'Not established; absence of a date does not prove unchanged text')],['Delivery confirmation',esc(r.delivery)],['Audio / video',esc(r.media)],['Source checked',esc(r.checked_on)]])}<h2>Church and role context</h2><p><strong>${esc(r.church)}</strong></p><p>${esc(r.church_context)}</p>${sources(r.church_sources)}<h2>What was checked</h2><p>${esc(r.quality)}</p>${r.source_notes.map(p=>`<p>${esc(p)}</p>`).join('')}<h2>AI-use evidence</h2><p>${esc(r.ai)}${r.ai==='Unknown'?'. No disclosure is not evidence of non-use.':'. The author reports assistance; task, extent and generated fraction are not established.'}</p><h2>Text reuse</h2>${itemRights(r)}${r.license_url?'<p>'+ext(r.license_url,'Publisher-associated license — read the item-specific limits above')+'</p>':''}`}
function source(r){main.innerHTML=`<a class="back" href="${backLink('sources')}">Back to source results</a><h1>${esc(r.name)}</h1><p>${esc(r.type)}</p>${tag(r.status,r.status.includes('blocked')?'blocked':'')}<div class="actions">${r.url?`<a class="action primary" href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">Open original source</a>`:'<p>No unrestricted public link was recorded.</p>'}</div>${facts([['Material',esc(r.unit)],['Formats',esc(r.formats)],['Text availability',esc(r.text)],['Languages',esc(r.languages)],['Geographic scope',esc(r.regions)],['Source checked',esc(r.checked_on)],['Collection assessment',esc(r.collection)],['Permission',esc(r.permission)],['AI evidence category',esc(r.ai)]])}<p>A source-level assessment does not establish permission for a particular sermon or AI use by its preacher.</p>${r.permission_url?'<p>'+ext(r.permission_url,'Read the source’s terms or permission statement')+'</p>':''}<p><a href="#view=about">Definitions and study limits</a></p>`}
function about(){main.innerHTML=`<h1>Scope and missing information</h1><h2>What is public?</h2><p>This site publishes factual metadata, researcher summaries and original-source links. It includes no full transcripts, manuscript bodies, captions, recording files or quoted sermon passages. The separately retained texts remain private.</p><div class="table-wrap method-table"><table><caption>How precise is a record?</caption><thead><tr><th>Field</th><th>Meaning</th></tr></thead><tbody><tr><td>Church</td><td>A congregation identity supported by the reviewed church pages or official directory. Location is shown at city/state level.</td></tr><tr><td>Pastor / clergy</td><td>A person and role explicitly stated in the linked source. This is dated source evidence, not a guarantee of a current appointment.</td></tr><tr><td>Item</td><td>One publisher item or manuscript. Speaker attribution, title, material type and dates retain the publisher’s stated scope.</td></tr><tr><td>Date</td><td>Recording label, reported delivery, publication and modification are separate. Unknown dates are not filled in.</td></tr><tr><td>Text quality</td><td>Reading and screening limits are stated on each item. Manuscripts and transcripts are not certified as complete spoken sermons.</td></tr><tr><td>Permission</td><td>Private retention, public reading and research reuse are different uses. Location-data licenses do not cover sermon content.</td></tr></tbody></table></div><h2>Why information is missing</h2><p>The church catalogue lists only the 86 accepted identities. The original 128 and the additional 6,000 location candidates remain separate research samples.</p><div class="table-wrap method-table"><table><caption>Identity review outcomes in the two samples</caption><thead><tr><th>Outcome</th><th>Original 128</th><th>Additional 6,000</th><th>Meaning</th></tr></thead><tbody><tr><td>Identity supported</td><td>48</td><td>38</td><td>Listed in the church catalogue.</td></tr><tr><td>Identity needs more evidence</td><td>36</td><td>78</td><td>A name, address, source match, current activity or shared-site relationship remains unsettled.</td></tr><tr><td>Excluded from the current count</td><td>1</td><td>5</td><td>Closure or a non-congregation institution; this does not decide historical eligibility.</td></tr><tr><td>Identity not yet reviewed</td><td>43</td><td>5,879</td><td>No completed identity decision. This is not evidence of failure.</td></tr></tbody></table></div><p>Among the 86 accepted identities, ${86-D.counts.churches_with_named_clergy} have no clergy name established in the reviewed pages and ${D.counts.affiliation_not_established} lack an exact denominational affiliation. All 86 still lack a sermon that clears every study requirement. These gaps overlap; do not add them. A source can be publicly readable while research reuse permission remains unknown.</p><h2>What the study can claim</h2><p>The records support source discovery and evidence review. They are not a representative U.S. church sample or a measure of AI adoption. The goal of at least 1,000 audited churches has not been reached. No formal sermon unit yet meets all eligibility requirements. The counts include only completed identity decisions.</p><p>Of the 36 earlier archive texts, 18 were screened as sermon/teaching candidates: 11 provisionally suitable for text analysis and seven requiring more review. The other 18 contain other or mixed genres. The separate 11-item collection contains four publisher timed transcripts and seven manuscripts. One manuscript reports AI preparation assistance; the other ten have unknown AI use. Six manuscripts have church/author context corroborated by official sources; that does not independently confirm delivery or spoken wording.</p><h2>Attribution</h2><p>Church-location selection derives from Overture Maps Places release 2026-10-21.0, including applicable Foursquare and AllThePlaces data. Locations were filtered, normalized, sampled and independently reviewed. These changes are not endorsed by the providers. Individual source links support the displayed church facts.</p><p>${ext('https://docs.overturemaps.org/attribution/','Overture attribution')} · ${ext('https://creativecommons.org/publicdomain/zero/1.0/','CC0 for applicable AllThePlaces records')}</p><p>${esc(D.map.attribution)} ${ext(D.map.source_url,'Map geometry source')}</p>${D.licenses.map(l=>`<details><summary>${esc(l.title)}</summary><pre class="license">${esc(l.text)}</pre></details>`).join('')}<h2>Dates and updates</h2><p>The church and item evidence was checked on the dates shown in each record. The public view was updated on 6 November 2026. Source links may change. The separate church-policy comparison retains its 23 October 2026 evidence cutoff.</p><div class="actions"><a class="action" href="#view=churches">Browse churches</a><a class="action" href="#view=items">Browse item records</a></div>`}
function exportCsv(view){const fields=view==='churches'?['name','city','state_name','affiliation','identity_status','checked_on']:view==='items'?['title','person','person_role','format','collection','source_url','checked_on']:['name','type','status','formats','permission','url','checked_on'];const values=shown.map(r=>fields.map(k=>r[k]));const quote=safeCsvCell;const csv='\uFEFF'+[fields.map(k=>({name:'Name',city:'City',state_name:'State',affiliation:'Affiliation',identity_status:'Identity evidence',checked_on:'Source checked',title:'Title',person:'Author or speaker',person_role:'Role evidence',format:'Text format',collection:'Collection',source_url:'Original source URL',type:'Source type',status:'Inspection status',formats:'Formats',permission:'Permission notes',url:'Original source URL'})[k]),...values].map(r=>r.map(quote).join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='sermon-research-'+view+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}

function feasibilityRows(){const pool=state.group==='supplemental'?F.supplemental:F.screens,q=(state.q||'').trim().toLowerCase();return pool.filter(r=>(!q||[r.name,r.city,r.state,r.tradition,r.speaker_evidence,r.route_label,...r.coverage].join(' ').toLowerCase().includes(q))&&(!state.region||state.region===r.state)&&(!state.tradition||state.tradition===r.tradition)&&(!state.route||state.route===r.route)&&(!state.category||state.category===r.category)).sort((a,b)=>state.sort==='state'?a.state.localeCompare(b.state)||a.name.localeCompare(b.name):state.sort==='name'?a.name.localeCompare(b.name):categoryOrder.indexOf(a.category)-categoryOrder.indexOf(b.category)||a.name.localeCompare(b.name))}
function feasibilityList(){const supplemental=state.group==='supplemental',pool=supplemental?F.supplemental:F.screens,rows=feasibilityRows();shown=rows;const options=(pairs,selected)=>'<option value="">All</option>'+pairs.map(([v,t])=>`<option value="${esc(v)}" ${selected===v?'selected':''}>${esc(t)}</option>`).join('');const unique=k=>[...new Set(pool.map(r=>r[k]))].sort().map(v=>[v,v]);const routes=[...new Map(pool.map(r=>[r.route,r.route_label])).entries()];main.innerHTML=`<h1>Collection feasibility</h1><p class="lead">Which sources offer text, recordings or a platform route—and what must be checked before collection?</p><div class="view-switch" aria-label="Source group"><a href="#view=feasibility" ${!supplemental?'aria-current="page"':''}>12 selected source screens</a><a href="#view=feasibility&group=supplemental" ${supplemental?'aria-current="page"':''}>3 supplemental leads</a></div>${supplemental?'<p class="notice">These three later leads are separate from the 12 selected screens and the 86 church identities. An unavailable source or unobserved archive is not evidence of zero sermons.</p>':`<p>The 12 sources were chosen for close inspection, not sampled to represent U.S. churches. They are separate from the <a href="#view=churches">86-identity catalogue</a>.</p><div class="category-key">${categoryOrder.map(cat=>{const matches=F.screens.filter(r=>r.category===cat);return `<a href="${path('feasibility',{category:cat})}">${tag(matches.length+' · '+matches[0].category_label,categoryTone[cat])}</a>`}).join('')}</div>`}<form class="filters" id="feasibility-filters"><input type="hidden" name="group" value="${supplemental?'supplemental':''}"><label class="search">Church, speaker or place<input type="search" name="q" autocomplete="off" value="${esc(state.q||'')}"></label><label>State<select name="region">${options(unique('state'),state.region)}</select></label><label>Tradition as evidenced<select name="tradition">${options(unique('tradition'),state.tradition)}</select></label><label>Route<select name="route">${options(routes,state.route)}</select></label><label>Assessment<select name="category">${options([...new Map(pool.map(r=>[r.category,r.category_label])).entries()],state.category)}</select></label><button type="button" id="feasibility-reset">Clear filters</button></form><div class="toolbar"><p class="status" role="status">${rows.length} of ${pool.length} ${supplemental?'supplemental leads':'selected source screens'} match.</p><div><label class="small">Sort <select id="feasibility-sort"><option value="category">Assessment</option><option value="name">Church / source</option><option value="state">State</option></select></label> <button id="feasibility-export">Export this list</button></div></div>${rows.length?`<div class="table-wrap feasibility-table" role="region" tabindex="0" aria-label="Collection routes; scroll horizontally on small screens"><table><caption>${supplemental?'Three supplemental leads':'Twelve selected source screens'} — metadata only</caption><thead><tr><th>Church / source</th><th>Route and tradition</th><th>Observed coverage</th><th>Author / speaker evidence</th><th>Next action</th></tr></thead><tbody>${rows.map(r=>`<tr><td><a class="name-link" href="${detailLink('feasibility',r)}">${esc(r.name)}</a><span class="sub">${esc(r.city)}, ${esc(r.state)}</span>${tag(r.category_label,categoryTone[r.category])}</td><td>${esc(r.route_label)}<span class="sub">${esc(r.tradition)}</span></td><td>${esc(r.coverage[0]||'Coverage not established')}<br><a href="${detailLink('feasibility',r)}">Dates, checks and limits</a></td><td>${esc(r.speaker_evidence)}</td><td>${esc(r.next_action)}<span class="sub">${r.source_links.length?ext(r.source_links[0].url,'Original source'):''}</span></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><h2>No matching sources</h2><p>Clear a filter to see more routes.</p></div>'}<p class="result-note">A route assessment is not permission for every operation. Speaker attribution, text availability, delivery evidence and reuse conditions are recorded separately. None of these observations establishes AI use.</p>`;const form=document.getElementById('feasibility-filters');const apply=()=>{clearTimeout(filterTimer);const focused=document.activeElement?.name,cursor=document.activeElement?.selectionStart,next={};for(const [k,v]of new FormData(form))if(v)next[k]=v;if(state.sort)next.sort=state.sort;history.replaceState(null,'',path('feasibility',next));render(false);const e=focused?document.querySelector(`[name="${focused}"]`):null;e?.focus();if(e?.type==='search'&&cursor!==null)e.setSelectionRange(cursor,cursor)};form.onsubmit=e=>{e.preventDefault();apply()};form.onchange=apply;form.elements.namedItem('q').oninput=()=>{clearTimeout(filterTimer);filterTimer=setTimeout(apply,250)};document.getElementById('feasibility-reset').onclick=()=>{location.hash=path('feasibility',supplemental?{group:'supplemental'}:{})};const sort=document.getElementById('feasibility-sort');sort.value=state.sort||'category';sort.onchange=()=>location.hash=path('feasibility',{...state,sort:sort.value});document.getElementById('feasibility-export').onclick=()=>downloadRows(supplemental?'supplemental-source-leads.csv':'collection-feasibility.csv',['Church / source','City','State','Tradition evidence','Assessment','Route','Speaker evidence','Observed coverage','Limits','Next action','Original sources'],shown.map(r=>[r.name,r.city,r.state,r.tradition,r.category_label,r.route_label,r.speaker_evidence,r.coverage.join(' | '),r.limits.join(' | '),r.next_action,r.source_links.map(x=>x.url).join(' | ')]))}
function rightsMarkup(id){const right=F.rights.find(r=>r.id===id);if(!right)return '<p>No item-specific license basis was established in this review. Public reading alone does not establish permission for bulk collection, transcription or redistribution.</p>';return `<p>${esc(right.scope)}</p><div class="table-wrap method-table"><table><caption>${esc(right.name)} — conditions depend on the operation</caption><thead><tr><th>Operation</th><th>Assessment</th><th>Conditions and limits</th></tr></thead><tbody>${right.operations.map(r=>`<tr><td>${esc(r.operation)}</td><td>${esc(r.status)}</td><td>${esc(r.conditions)}</td></tr>`).join('')}</tbody></table></div>${originalLinks(right.sources)}<p class="small">The actual use determines whether a NonCommercial condition is satisfied; university, nonprofit or private use is not sufficient by itself. Analysis is not automatically adaptation. This website publishes metadata only.</p>`}
function feasibilityDetail(r){const extra=F.supplemental.some(x=>x.id===r.id);main.innerHTML=`<a class="back" href="${backLink('feasibility')}">Back to collection routes</a><h1>${esc(r.name)}</h1><p class="lead">${esc(r.city)}, ${esc(r.state)}</p>${tag(extra?'Supplemental lead':r.category_label,categoryTone[r.category])}<p class="small muted">${extra?'One of three later leads; outside the 12 selected screens.':'One of 12 deliberately selected source screens; not an addition to the 86 church identities.'}</p>${facts([['Tradition evidence',esc(r.tradition)],['Collection route',esc(r.route_label)],['Author / speaker evidence',esc(r.speaker_evidence)],['Source checked',esc(r.checked_on)]])}<h2>Observed coverage</h2>${listText(r.coverage)}<h2>What remains to check</h2>${listText(r.limits)}<p class="next-step"><strong>Next action</strong><br>${esc(r.next_action)}</p>${r.observations?.length?observationTable(r):''}${r.case_study?caseStudyMarkup(r.case_study):''}<h2>Access and reuse by operation</h2>${rightsMarkup(r.rights_id)}<h2>Original sources</h2>${originalLinks(r.source_links)}${r.directory_id&&D.churches.some(c=>c.id===r.directory_id)?`<p><a href="${path('churches',{id:r.directory_id})}">Related church identity and clergy evidence</a></p>`:''}<p class="small">A church role, manuscript author and event speaker are separate claims. These records do not establish AI use.</p>`;if(r.case_study)bindCaseStudy(r.case_study)}
function caseStudyMarkup(kind){const x=F[kind],fourth=kind==='fourth';return `<section class="case-study" aria-labelledby="case-title"><h2 id="case-title">${fourth?'Fourth: index records and exact-page checks':'Thomas: annual indexes and October page checks'}</h2><div class="metric-grid">${(fourth?[[x.annual_records.length,'Annual index records'],[x.target_checks.length,'Nested target checks'],[x.target_checks.filter(r=>r.body_visible).length,'Bodies rendered']]:[[x.annual_records.length,'Annual index entries'],[x.october_observations.length,'Nested October observations'],[x.october_observations.filter(r=>r.status==='readable').length,'Latest successful reads']]).map(([n,t])=>`<div><strong>${n}</strong><span>${t}</span></div>`).join('')}</div><p>${fourth?'The 33 target checks are within the 107 index records. Two index entries explicitly say no sermon; another groups youth homilies. “No inspected conflict” means no conflict was recorded in the inspected fields. Generic index labels can differ from specific page titles; this does not confirm a complete delivered sermon.':'The nine October observations are within the 88 annual entries. One latest page read failed despite an earlier successful observation. Publication dates and stated sermon dates are shown separately.'}</p>${listText(x.limits)}<div class="study-controls"><label>Year <select id="study-year"><option value="">2022 and 2025</option><option>2022</option><option>2025</option></select></label><label>Check result <select id="study-status"><option value="">All results</option>${[...new Map((fourth?x.target_checks:x.october_observations).map(r=>[r.status,r.status_label])).entries()].map(([v,t])=>`<option value="${esc(v)}">${esc(t)}</option>`).join('')}</select></label><button id="study-reset">Clear check filters</button><button id="study-export">Export displayed checks</button></div><div id="study-checks"></div>${fourth?'<h3>Speaker-specific index and target counts</h3><div id="study-speakers"></div>':'<h3>Same liturgical label does not always mean the same passage</h3><div id="study-pairs"></div>'}<details id="annual-index"><summary>Annual index records — dates, titles and links</summary><p class="small">The year filter above applies here; the check-result filter applies only to the inspected subset. Index dates and titles are publisher observations, not independently verified delivery.</p><button id="annual-export">Export annual index rows</button><div id="study-annual"></div></details></section>`}
function readableValue(value){if(value===null||value===undefined||value==='')return 'Not established';if(Array.isArray(value))return value.join('; ');return String(value)}
function metaTable(caption,headers,rows){return `<div class="table-wrap study-table" role="region" tabindex="0" aria-label="${esc(caption)}; scroll to inspect all columns"><table><caption>${esc(caption)}</caption><thead><tr>${headers.map(h=>`<th scope="col">${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function bindCaseStudy(kind){const x=F[kind],fourth=kind==='fourth',all=fourth?x.target_checks:x.october_observations;let selected=[],annual=[];const update=()=>{const year=document.getElementById('study-year').value,status=document.getElementById('study-status').value;selected=all.filter(r=>(!year||String(r.year)===year)&&(!status||r.status===status));annual=x.annual_records.filter(r=>!year||String(r.year)===year);const cols=fourth?['Index date / title','Index speaker','Rendered page fields','Service-time evidence','Check result']:['Stated sermon date / title','Publication date','Author','Passage and label','Latest read and earlier evidence'];const rows=selected.map(r=>fourth?[`${esc(r.date)}<br>${ext(r.item_url||r.source_url,r.title)}`,esc(readableValue(r.speaker)),`${esc(readableValue(r.detail_title))}<br><span class="sub">${esc(readableValue(r.detail_speaker))} · ${esc(readableValue(r.detail_date))}</span>`,`Indexed: ${esc(readableValue(r.index_service_time))}<br>Target header: ${esc(readableValue(r.detail_service_time))}<br>Agreement: ${esc(readableValue(r.confirmed_service_time))}`,`${tag(r.status_label,r.status==='no_conflict'?'known':r.status==='discrepancy'?'caution':'blocked')}<span class="sub">${esc(r.exception||'No inspected conflict; delivery not independently confirmed.')}</span>`]:[`${esc(r.date)}<br>${ext(r.source_url,r.title)}`,esc(readableValue(r.publication_date)),esc(readableValue(r.speaker)),`${esc(readableValue(r.liturgical_label))}<br>${esc(readableValue(r.passages))}`,`${tag(r.status_label,r.status==='unavailable'?'blocked':'known')}<span class="sub">${esc(r.notes||'')}${r.earlier_observation?' '+esc(r.earlier_observation):''}${r.additional_displayed_date?' Additional displayed date: '+esc(r.additional_displayed_date)+' ('+esc(r.additional_date_meaning)+').':''}</span>`]);document.getElementById('study-checks').innerHTML=`<p role="status" class="small">${selected.length} of ${all.length} inspected observations match.</p>`+(rows.length?metaTable(fourth?'Exact-target checks — discrepancies remain separate':'October observations — latest and earlier access evidence',cols,rows):'<p>No observations match these check filters.</p>');document.getElementById('study-annual').innerHTML=metaTable(`${annual.length} annual index records`,['Original index date / label','Stated date used','Title','Author / speaker','Record type / date basis','Selected check'],annual.map(r=>[esc(readableValue(r.index_date||r.date)),esc(readableValue(r.date)),ext(r.item_url||r.source_url,r.title),esc(readableValue(r.speaker)),esc([r.record_kind,r.date_basis].filter(Boolean).join(' · ')||'Index entry'),esc(r.status_label||'Not in the selected exact-page checks')]));};document.getElementById('study-year').onchange=update;document.getElementById('study-status').onchange=update;document.getElementById('study-reset').onclick=()=>{document.getElementById('study-year').value='';document.getElementById('study-status').value='';update()};document.getElementById('study-export').onclick=()=>downloadRows(kind+'-displayed-checks.csv',fourth?['Index date','Index title','Index speaker','Index service time','Rendered title','Rendered speaker','Rendered date','Target-header service time','Agreement on service time','Check result','Exception','Original URL']:['Stated sermon date','Title','Author','Publication date','Liturgical label','Header passages','Latest read','Earlier observation','Notes','Additional displayed date','Additional date meaning','Original URL'],selected.map(r=>fourth?[r.date,r.title,r.speaker,r.index_service_time,r.detail_title,r.detail_speaker,r.detail_date,r.detail_service_time,r.confirmed_service_time,r.status_label,r.exception,r.item_url||r.source_url]:[r.date,r.title,r.speaker,r.publication_date,r.liturgical_label,r.passages?.join('; '),r.status_label,r.earlier_observation,r.notes,r.additional_displayed_date,r.additional_date_meaning,r.source_url]));document.getElementById('annual-export').onclick=()=>downloadRows(kind+'-annual-index.csv',['Original index date or label','Stated date used','Title','Author / speaker','Record type','Date basis','Publication date','Index service time','Agreement on service time','Check status','Original URL'],annual.map(r=>[r.index_date||r.date,r.date,r.title,r.speaker,r.record_kind,r.date_basis,r.publication_date,r.index_service_time,r.confirmed_service_time,r.status_label,r.item_url||r.source_url]));renderStudySupplement(kind);update()}
function renderStudySupplement(kind){const x=F[kind];if(kind==='fourth'){const rows=x.annual_speakers.map(r=>{const index=y=>r.years.find(v=>v.year===y),target=y=>x.speakers.find(v=>v.speaker===r.speaker)?.years.find(v=>v.year===y);const counts=y=>{const i=index(y),t=target(y);return `${i.index_records} index records · ${i.text_links} text links<br><span class="sub">${t?`${t.targets} target checks: ${t.no_inspected_conflict} without inspected conflict, ${t.discrepancies} discrepancies, ${t.unavailable} unavailable`:'Not selected for exact-target checks'}</span>`};return [esc(r.speaker),counts(2022),counts(2025)]});document.getElementById('study-speakers').innerHTML='<p class="small">Speakers named in both annual indexes. These are names as written, not an independent personnel-identity audit. Target checks are subsets of the index records.</p>'+metaTable('Speaker-specific 2022 and 2025 counts',['Name as written','2022','2025'],rows)}else{document.getElementById('study-pairs').innerHTML='<p class="small">Three pairs share a liturgical label. Only one pair has the same inspected header passage; two have different passages. This is a pairing aid, not a measure of AI use.</p>'+metaTable('Matched liturgical labels and inspected header passages',['Liturgical label','2022 observation','2025 observation','Passage comparison'],x.passage_pairs.map(r=>[esc(r.label),`${esc(r.pre_date)}<br>${ext(r.pre_url,r.pre_title)}<br>${esc(r.pre_passages.join('; '))}`,`${esc(r.post_date)}<br>${ext(r.post_url,r.post_title)}<br>${esc(r.post_passages.join('; '))}`,tag(r.result,r.same_passage?'known':'caution')]))}const cadence=metaTable('Annual index coverage against calendar Sundays',['Year','Index records','Calendar Sundays','Sunday dates with an index record','Sunday dates not observed'],x.annual_summary.map(r=>[esc(r.year),esc(r.index_records),esc(r.calendar_sundays),esc(r.sunday_dates_with_record),esc(r.sunday_dates_not_observed.join(', ')||'None in inspected index')]));document.getElementById('study-annual').insertAdjacentHTML('beforebegin','<h3>Index coverage</h3><p class="small">A date absent from an inspected index is not proof that no sermon occurred. Multiple items can share a date, and some index entries describe other event types.</p>'+cadence)}

function observationTable(r){return '<h2>Observed item records</h2><p class="small">'+r.observations.length+' metadata observations for this source. Dates retain their stated meaning; source access and speaker evidence can differ by item.</p>'+metaTable('Item observations and access limits',['Date and meaning','Title / original','Author or speaker','Format','What was observed'],r.observations.map(o=>[`${esc(readableValue(o.date))}${o.publication_date?'<br>Published '+esc(o.publication_date):''}<span class="sub">${esc(o.date_basis)}</span>`,ext(o.source_url,o.title),esc(readableValue(o.speaker)),esc(o.format),`${esc(o.status_label)}<span class="sub">${esc(o.note)}</span>`]))}

function itemRights(r){const match=F.rights.find(right=>right.sources.some(s=>s.url===r.source_url));return match?rightsMarkup(match.id):`<p>${esc(r.rights)}</p>`}

document.querySelector('.skip').addEventListener('click',e=>{e.preventDefault();main.focus();main.scrollIntoView()});
addEventListener('hashchange',()=>render());render(false);
</script></body></html>
